services:
  # Database: PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: new_rms_postgres
    restart: always
    environment:
      POSTGRES_DB: new_rms_db
      POSTGRES_USER: rms_admin
      POSTGRES_PASSWORD: rms_password_secure_2026
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - rms_network

  # Cache & Background Queue: Redis
  redis:
    image: redis:7-alpine
    container_name: new_rms_redis
    restart: always
    ports:
      - "6385:6379"
    volumes:
      - redisdata:/data
    networks:
      - rms_network

networks:
  rms_network:
    driver: bridge

volumes:
  pgdata:
  redisdata:
